<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening</title>

      <style>
      :root {
        --submit-bg: #726290;
        --submit-text: #ffffff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #ffffff;;

      }
      .background {
        position: fixed;
        top: 0;
        left: 0;
        display: block;
        width: 100%;
        height: auto;
        z-index: 0;
        pointer-events: none;
      }
        .quiz-container {
            position: relative;
            z-index: 1;
            bottom: 1vh;
            background: rgba(255, 212, 234, 0.41);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            text-align: center;
            width: 320px;
        }
           h2 {
        margin-top: 0;
        margin-bottom: 15px;
        font-size: 1.20rem;
        line-height: 1.27;
        word-wrap: break-word;
      }
       
        #submit-btn {
            background: var(--submit-bg);
            color: var(--submit-text);
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            margin-top: 20px;
            cursor: pointer;
            width: 100%;
        }
    </style>    

</head>
<body>
  <img class="background" src="images/b2.png" alt="">
    <div class="quiz-container">
    <h2> 故事開始你站在門半開著的城堡前，即將開啟一場冒險……</h2>
   
    <button id="submit-btn" onclick="nextPage(1, 'question1.html')">開始</button>

    <p id="result"></p>
  </div>

  <script>
    function nextPage(questionNumber, nextPage) {
      
    window.location.href = nextPage;  
    } 
  </script> 

</body>
</html>
