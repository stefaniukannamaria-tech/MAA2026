<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 1</title>

      <style>
        .scene {
  position: relative;
  width: 100%;
}

/* keep your quiz box above most images */
.quiz-container {
  position: fixed;
  left: 50%;
  bottom: 10vh;
  transform: translateX(-50%);
  z-index: 20;
}

.background {
  display: block;
  width: 100%;
  height: auto;
}

      :root {
        --submit-bg: #e885a1;
        --submit-text: #ffffff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        height: 100%;
        display: block;
        place-items: center;
        font-family: Arial, sans-serif;
        /* colorful background */
        background: #ffffff;
        position: absolute;
        inset: 0;
        width: 100%;
        object-fit: cover;
      }
        .quiz-container {
            background: rgba(255, 182, 200, 0.753);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            text-align: center;
            width: 320px;
        }
           h2 {
        margin-top: 0;
        margin-bottom: 18px;
        font-size: 1.8rem;
        line-height: 1.35;
        word-wrap: break-word;
      }
       
        #submit-btn {
            background: var(--submit-bg);
            color: var(--submit-text);
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            margin-top: 20px;
            cursor: pointer;
            width: 100%;
        }
    </style>    

</head>
<body>
  <div class="scene">
    <img class="background" src="images/starting.png" alt="">
  </div>
    <div class="quiz-container">
    <h2> 故事開始你站在門半開著的城堡前，即將開啟一場冒險……</h2>
   
    <button id="submit-btn" onclick="nextPage(1, 'openingPage.html')">開始</button>

    <p id="result"></p>
  </div>

  <script>
    function nextPage(questionNumber, nextPage) {
      
    window.location.href = nextPage;  
    } 
  </script> 

</body>
</html>
