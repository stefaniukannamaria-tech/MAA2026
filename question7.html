<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 1</title>

      <style>
/* overlay layer for decorative PNGs */
.scene {
  position: fixed;
  inset: 0;
  z-index: 5;
  pointer-events: none;
}

        /* keep your quiz box above most images */
.quiz-container {
  margin-top: clamp(64px, 35vh, 800px);
  position: relative;
  z-index: 20;
}

/* reusable style for all PNGs */
.pgn {
  position: absolute;
  width: 90vw;
  left: 5vw;
  top: var(--top, 0vh);
  z-index: var(--z, 1);   
  pointer-events: none;     
}
      :root {
        /* easy color controls */
         --answer-bg: #ccdaffb6;
        --answer-text: #4c566b;
        --answer-border: #ffffff;
        --answer-selected: #a5b4ea;

        --submit-bg: #cf72b1;
        --submit-text: #ffffff;
        --submit-disabled: #e2a4cc;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #ffffff;
      }
      .background {
    display: block;
    width: 100%;
    height: auto;
    z-index: 0;
}
        .quiz-container {
            bottom: 5vh;
            background: rgba(255, 189, 226, 0.486);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            text-align: center;
            width: 320px;
        }
           h2 {
        margin-top: 0;
        margin-bottom: 18px;
        font-size: 1.8rem;
        line-height: 1.35;
        word-wrap: break-word;
      }
        .answer-btn {
            background: var(--answer-bg);
            color: var(--answer-text);
            border: 1px solid var(--answer-border);
            border-radius: 8px;
            padding: 10px 20px;
            margin: 5px 0;
            cursor: pointer;
            width: 100%;
        }
        .answer-btn.selected {
            background: var(--answer-selected);
        }
        #submit-btn {
            background: var(--submit-bg);
            color: var(--submit-text);
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            margin-top: 20px;
            cursor: pointer;
            width: 100%;
        }
        #submit-btn:disabled {
            background: var(--submit-disabled);
            cursor: not-allowed;
        }
    </style>    

</head>
<body>
   <div class="scene">
   <img class="background" src="images/q7.png" alt="">
</div>
    <div class="quiz-container">
    <h2>你碰了那個東西，房間開始改變，你感受到的第一反應是？</h2>

    <button class="answer-btn" onclick="selectAnswer('a', this)">興奮，甚至期待一切能更瘋狂</button>
    <button class="answer-btn" onclick="selectAnswer('b', this)">有點不安，但也被吸引</button>
    <button class="answer-btn" onclick="selectAnswer('c', this)">觀察變化規則靜待平靜</button>
    <button class="answer-btn" onclick="selectAnswer('d', this)">放任變化發生，甚至覺得有趣</button>
   
    <button id="submit-btn" onclick="submitAnswer(7, 'question8.html')" disabled>Submit</button>

    <p id="result"></p>
  </div>

  <script>
    let currentSelection = null;

    function selectAnswer(value, btn)   
    {
   currentSelection = value;

    // optional visual state
    document.querySelectorAll('.answer-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');

    document.getElementById('submit-btn').disabled = false;
    }

    function submitAnswer(questionNumber, nextPage) {
       if (!currentSelection) return;

    const savedAnswers = JSON.parse(sessionStorage.getItem('quizAnswers')) || {};
    savedAnswers[questionNumber] = currentSelection;
    sessionStorage.setItem('quizAnswers', JSON.stringify(savedAnswers));

    window.location.href = nextPage;  
    } 
  </script> 

</body>
</html>
